# =====================================================================
# Payment Service — Application Configuration
# =====================================================================

# Application
spring.application.name=payment-service
server.port=${SERVER_PORT:8081}

# =====================================================================
# Database — PostgreSQL (shared database, Phase 1)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/smart_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# RabbitMQ
# =====================================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:inventory.exchange}
app.rabbitmq.routing-key.payment-completed=${APP_RABBITMQ_ROUTING_KEY_PAYMENT_COMPLETED:payment.completed}

# =====================================================================
# Actuator / Health Probes
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# =====================================================================
# Logging
# =====================================================================
logging.level.root=INFO
logging.level.com.smartinventory.paymentservice=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================================
# CORS Configuration
# =====================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allow-credentials=true
app.cors.max-age=3600

