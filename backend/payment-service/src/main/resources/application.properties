# =====================================================================
# Payment Service — Application Configuration
# =====================================================================

# Application
spring.application.name=payment-service
server.port=8081

# =====================================================================
# Database — PostgreSQL (shared database, Phase 1)
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# RabbitMQ
# =====================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# =====================================================================
# Logging
# =====================================================================
logging.level.root=INFO
logging.level.com.smartinventory.paymentservice=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================================
# Application Custom Properties
# =====================================================================
app.rabbitmq.exchange=inventory.exchange
app.rabbitmq.routing-key.payment-completed=payment.completed
