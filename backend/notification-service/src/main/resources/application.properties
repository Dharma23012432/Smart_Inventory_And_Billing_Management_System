# =====================================================================
# Notification Service — Application Configuration
# =====================================================================

# Application
spring.application.name=notification-service
server.port=8082

# =====================================================================
# Database — PostgreSQL (shared database, Phase 1)
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# RabbitMQ
# =====================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=inventory.exchange
app.rabbitmq.queue.payment-completed=payment.completed.queue
app.rabbitmq.queue.low-stock=stock.low.queue
app.rabbitmq.routing-key.payment-completed=payment.completed
app.rabbitmq.routing-key.low-stock=stock.low

# =====================================================================
# Spring Mail (SMTP)
# Update host, port, username, and password before Phase 8 (Notification Service).
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================================
# Logging
# =====================================================================
logging.level.root=INFO
logging.level.com.smartinventory.notificationservice=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=DEBUG
