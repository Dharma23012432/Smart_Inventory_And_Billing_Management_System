# =====================================================================
# Notification Service — Application Configuration
# =====================================================================

# Application
spring.application.name=notification-service
server.port=${SERVER_PORT:8082}

# =====================================================================
# Database — PostgreSQL (shared database, Phase 1)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/smart_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# RabbitMQ
# =====================================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:inventory.exchange}
app.rabbitmq.queue.bill-confirmed=${APP_RABBITMQ_QUEUE_BILL_CONFIRMED:bill.confirmed.queue}
app.rabbitmq.queue.payment-completed=${APP_RABBITMQ_QUEUE_PAYMENT_COMPLETED:payment.completed.queue}
app.rabbitmq.queue.low-stock=${APP_RABBITMQ_QUEUE_LOW_STOCK:stock.low.queue}
app.rabbitmq.routing-key.bill-confirmed=${APP_RABBITMQ_ROUTING_KEY_BILL_CONFIRMED:bill.confirmed}
app.rabbitmq.routing-key.payment-completed=${APP_RABBITMQ_ROUTING_KEY_PAYMENT_COMPLETED:payment.completed}
app.rabbitmq.routing-key.low-stock=${APP_RABBITMQ_ROUTING_KEY_LOW_STOCK:stock.low}

# =====================================================================
# Actuator / Health Probes
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# =====================================================================
# Spring Mail (SMTP)
# Configure SMTP properties from environment variables or application.properties.
# =====================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:no-reply@smartinventory.com}}

# =====================================================================
# Logging
# =====================================================================
logging.level.root=INFO
logging.level.com.smartinventory.notificationservice=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=DEBUG

# =====================================================================
# CORS Configuration
# =====================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allow-credentials=true
app.cors.max-age=3600

